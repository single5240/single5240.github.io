- id: ai-asmr
  title: AI-ASMR 沉浸式声音实验室
  subtitle: 双耳 3Dio 雨声、钝感敲击、轻柔摩擦、清润水流、能量钵铃、理发伴读、暖冬壁炉、触觉揉捏、客制化机械键盘与深空漫游触发器及提示词工坊
  description: 零外部依赖的纯原生 Web Audio API 程序化物理声学合成引擎。集成「沉浸雨声」（微雨/小雨/大雨/倾盆/远雷）、「轻柔敲击声」（空心木盒/精装书/软硅胶/厚陶杯/竹节）、「细腻摩擦声」（软毛刷/天鹅绒/微砂台/指腹轻摩/书页）、「清润水流声」（山涧清泉/鹅卵石浅溪/幽潭微涌/粘稠气泡/添水竹韵）、「能量泛音与音疗钵铃」（西藏手工颂钵/柯西和弦风铃/432Hz双耳音叉/水晶石英钵/禅意碰铃）、「理发伴读微机械」（锋利理发轻剪/密齿木梳/棉纸素描铅笔/复古打字机/雾化水喷）、「暖冬壁炉与自然碎裂」（松木炭火/干燥落叶/营火余烬/松果微压/竹炭慢烘）与「触觉揉捏与软胶」（慢回弹海绵/天然蜂蜡/水晶泥软胶/亚麻油纸微褶/流沙解压）十大 ASMR 触发体系（70+ 种纯物理声音），支持多手法与双耳 3Dio 空间穿梭。全频段低通柔化（去尖锐、去齿音、防爆音），并内置一键式专业 AI ASMR 提示词工坊。
  url: /projects/ai-asmr/index.html
