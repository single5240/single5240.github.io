<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: page.title | escape }}">
  <meta name="theme-color" content="#0f8b8d">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:title" content="{{ page.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: page.title | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/images/engineer-computer-lineart.jpg' | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | escape }}">
  <meta name="twitter:description" content="{{ page.description | default: page.title | escape }}">
  <meta name="twitter:image" content="{{ '/assets/images/engineer-computer-lineart.jpg' | absolute_url }}">
  <meta property="og:site_name" content="single5240 笔记分享">
  <meta property="og:image:alt" content="工程师操作电脑进行嵌入式开发调试的线稿插画">
  <title>{{ page.title | escape }} | single5240</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="alternate" type="application/atom+xml" title="single5240 笔记分享" href="{{ '/feed.xml' | relative_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/assets/icon-192.png' | relative_url }}">
  <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
  <script src="{{ '/assets/js/theme.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  <link rel="stylesheet" href="{{ '/assets/css/base.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <style>
    body {
      line-height: 1.75;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--header-line);
      background: var(--header-bg);
      backdrop-filter: blur(18px);
    }

    .nav,
    .page {
      width: min(860px, calc(100% - 32px));
      margin: 0 auto;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 68px;
      gap: 16px;
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
    }

    .nav-links a {
      color: var(--muted);
      font-weight: 650;
      text-decoration: none;
    }

    .nav-links a:hover,
    .nav-links a[aria-current="page"] {
      color: var(--accent-dark);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      font-weight: 850;
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border-radius: 8px;
      background: var(--accent);
      color: var(--on-accent);
      font-size: 14px;
    }

    .page {
      padding: 36px 0 72px;
    }

    .page h1 {
      margin: 0 0 12px;
      font-size: clamp(34px, 6vw, 52px);
      line-height: 1.12;
    }

    .page h2 {
      margin: 28px 0 10px;
      font-size: clamp(22px, 3vw, 28px);
      line-height: 1.25;
    }

    .lede {
      margin-top: 0;
      color: var(--muted);
      font-size: 18px;
    }

    .page a {
      color: var(--accent-dark);
      font-weight: 750;
      text-decoration: underline;
      text-underline-offset: 0.16em;
    }

    .study-sentence {
      margin: 18px 0;
      padding: 4px 0 4px 16px;
      border-left: 3px solid var(--warm);
      color: var(--ink);
      font-size: clamp(20px, 3vw, 26px);
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .study-sentence p {
      margin: 0;
    }

    .study-source {
      margin-top: 0;
      color: var(--accent-dark);
      font-weight: 750;
    }

    .study ol {
      padding-left: 1.3em;
    }

    .study li + li {
      margin-top: 8px;
    }

    .vocab,
    .archive,
    .day-list {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .vocab li,
    .archive li,
    .day-list li,
    .week {
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .week + .week {
      margin-top: 18px;
    }

    .week h2 {
      margin-top: 0;
    }

    .vocab-word {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px;
      margin: 0 0 6px;
      font-weight: 800;
    }

    .phonetic,
    .pos,
    .archive p,
    .day-list p,
    .note {
      color: var(--muted);
    }

    .pos {
      color: var(--accent-dark);
      font-size: 13px;
      font-weight: 750;
    }

    .example {
      margin-bottom: 0;
      color: var(--body-copy);
      font-style: italic;
      overflow-wrap: anywhere;
    }

    .note {
      padding-left: 14px;
      border-left: 2px solid var(--warm);
    }

    .pager {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      margin-top: 28px;
    }

    .site-footer {
      padding: 28px 0 36px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    @media (max-width: 720px) {
      .nav {
        align-items: flex-start;
        flex-direction: column;
        padding: 14px 0;
      }

      .page {
        padding-top: 24px;
      }

      .vocab li,
      .archive li,
      .day-list li,
      .week {
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <header class="site-header">
    <nav class="nav" aria-label="主导航">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark">S5</span>
        <span>single5240</span>
      </a>
      <div class="nav-actions">
        <div class="nav-links">
          <a href="{{ '/' | relative_url }}">首页</a>
          <a href="{{ '/' | relative_url }}#articles">文章</a>
          <a href="{{ '/english/index.html' | relative_url }}"{% if page.url == "/english/index.html" %} aria-current="page"{% endif %}>每日英语</a>
          <a href="{{ '/ai-news/index.html' | relative_url }}"{% if page.url == "/ai-news/index.html" %} aria-current="page"{% endif %}>AI 资讯</a>
          <a href="{{ '/board.html' | relative_url }}">板子项目</a>
        </div>
        <div class="theme-picker" data-theme-picker></div>
      </div>
    </nav>
  </header>
  <main class="page" id="main-content">
    {{ content }}
  </main>
  <footer class="site-footer">
    <span>© {{ site.time | date: "%Y" }} single5240. Built with GitHub Pages.</span>
  </footer>
</body>
</html>
