name: Site quality and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true
      - name: Build Jekyll site
        run: bundle exec jekyll build --strict_front_matter
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Check generated pages and internal links
        run: node scripts/check-site.mjs
      - name: Check shared JavaScript syntax
        run: |
          shopt -s globstar nullglob
          for file in assets/js/**/*.js scripts/*.mjs; do node --check "$file"; done
      - name: Check ASMR groove bounds and continuity
        run: node scripts/check-asmr-groove.mjs
      - name: Check report import regression
        run: node --test scripts/import-ai-news.test.mjs
      - name: Check temporary kanban data and expiry
        run: node --test scripts/kanban.test.mjs
      - name: Upload verified Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-and-check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy checked site
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-aliyun:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-and-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
      ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
      ALIYUN_SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
      ALIYUN_KNOWN_HOSTS: ${{ secrets.ALIYUN_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Download the checked website
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/aliyun-artifact
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          for name in ALIYUN_HOST ALIYUN_USER ALIYUN_SSH_KEY ALIYUN_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ALIYUN_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/aliyun_deploy"
          printf '%s\n' "$ALIYUN_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/aliyun_deploy" "$HOME/.ssh/known_hosts"
      - name: Upload and activate the website
        shell: bash
        run: |
          set -euo pipefail
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          destination="${ALIYUN_USER}@${ALIYUN_HOST}"
          archive="site-${release_id}.tar"
          options=(-i "$HOME/.ssh/aliyun_deploy" -o IdentitiesOnly=yes
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          scp "${options[@]}" "$RUNNER_TEMP/aliyun-artifact/artifact.tar" "$destination:$archive"
          ssh "${options[@]}" "$destination" "bash -s -- '$archive' '$release_id'" < scripts/deploy-static-site.sh
      - name: Sync S5·BOT proxy
        shell: bash
        run: |
          set -euo pipefail
          destination="${ALIYUN_USER}@${ALIYUN_HOST}"
          options=(-i "$HOME/.ssh/aliyun_deploy" -o IdentitiesOnly=yes
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          test -f server/s5bot_proxy.py
          scp "${options[@]}" server/s5bot_proxy.py "$destination:/var/www/s5bot/s5bot_proxy.py.new"
          ssh "${options[@]}" "$destination" 'bash -s' <<'EOF'
          set -euo pipefail
          cd /var/www/s5bot
          python3 -m py_compile s5bot_proxy.py.new
          mv -f s5bot_proxy.py.new s5bot_proxy.py
          if sudo -n systemctl restart s5bot >/dev/null 2>&1; then
            echo "s5bot restarted via sudo -n"
          else
            # 启动时 configure() 会先拉上游 /models，端口稍后才监听。
            # Restart=on-failure 会对 SIGKILL 拉起新进程并加载刚换上的脚本。
            pids=$(pgrep -f '/var/www/s5bot/s5bot_proxy.py' || true)
            if [[ -n "${pids}" ]]; then
              kill -9 ${pids}
              echo "s5bot old pid(s) killed: ${pids}"
            else
              echo "s5bot process not found; waiting for systemd or manual start" >&2
            fi
          fi
          ok=0
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 3 http://127.0.0.1:8765/api/health >/tmp/s5bot-health.json; then
              ok=1
              break
            fi
            sleep 1
          done
          if [[ "$ok" != 1 ]]; then
            echo "s5bot health check failed after sync" >&2
            systemctl --no-pager --full status s5bot || true
            exit 1
          fi
          python3 - <<'PY'
          import json
          data = json.load(open("/tmp/s5bot-health.json", encoding="utf-8"))
          models = data.get("models") or []
          print(f"s5bot ok={data.get('ok')} poolCount={data.get('poolCount')} models={len(models)}")
          for item in models:
              print(" -", item.get("id"))
          PY
          EOF
      - name: Remove temporary SSH credentials
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/aliyun_deploy" "$HOME/.ssh/known_hosts"
