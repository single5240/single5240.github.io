name: Site quality and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true
      - name: Build Jekyll site
        run: bundle exec jekyll build --strict_front_matter
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Check generated pages and internal links
        run: node scripts/check-site.mjs
      - name: Check shared JavaScript syntax
        run: |
          shopt -s globstar nullglob
          for file in assets/js/**/*.js scripts/*.mjs; do node --check "$file"; done
      - name: Check ASMR groove bounds and continuity
        run: node scripts/check-asmr-groove.mjs
      - name: Check report import regression
        run: node --test scripts/import-ai-news.test.mjs
      - name: Check temporary kanban data and expiry
        run: node --test scripts/kanban.test.mjs
      - name: Upload verified Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-and-check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy checked site
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-aliyun:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-and-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
      ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
      ALIYUN_SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
      ALIYUN_KNOWN_HOSTS: ${{ secrets.ALIYUN_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Download the checked website
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/aliyun-artifact
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          for name in ALIYUN_HOST ALIYUN_USER ALIYUN_SSH_KEY ALIYUN_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ALIYUN_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/aliyun_deploy"
          printf '%s\n' "$ALIYUN_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/aliyun_deploy" "$HOME/.ssh/known_hosts"
      - name: Upload and activate the website
        shell: bash
        run: |
          set -euo pipefail
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          destination="${ALIYUN_USER}@${ALIYUN_HOST}"
          archive="site-${release_id}.tar"
          options=(-i "$HOME/.ssh/aliyun_deploy" -o IdentitiesOnly=yes
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          scp "${options[@]}" "$RUNNER_TEMP/aliyun-artifact/artifact.tar" "$destination:$archive"
          ssh "${options[@]}" "$destination" "bash -s -- '$archive' '$release_id'" < scripts/deploy-static-site.sh
      - name: Remove temporary SSH credentials
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/aliyun_deploy" "$HOME/.ssh/known_hosts"
