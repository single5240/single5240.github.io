<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460">
<defs>
  <pattern id="asmr-grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#c4d3cf" stroke-width=".6"/>
  </pattern>
  <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0f191d"/>
    <stop offset="100%" stop-color="#070d10"/>
  </linearGradient>
  <linearGradient id="cyan-glow" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.4"/>
  </linearGradient>
  <linearGradient id="ear-l" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#0f766e" stop-opacity="0.1"/>
  </linearGradient>
  <linearGradient id="ear-r" x1="1" y1="0" x2="0" y2="0">
    <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#0369a1" stop-opacity="0.1"/>
  </linearGradient>
</defs>

<!-- 背景与工程网格 -->
<rect width="640" height="460" fill="#e9efeb"/>
<rect width="640" height="460" fill="url(#asmr-grid)"/>

<!-- 引线与技术标定 -->
<g fill="none" stroke="#79948d" stroke-width="1">
  <path d="M35 110H130M35 230H130M35 350H130M510 130H605M510 330H605"/>
  <circle cx="35" cy="110" r="3"/>
  <circle cx="35" cy="230" r="3"/>
  <circle cx="35" cy="350" r="3"/>
  <circle cx="605" cy="130" r="3"/>
  <circle cx="605" cy="330" r="3"/>
</g>
<g font-family="monospace" font-size="11" fill="#41675d">
  <text x="37" y="96">3Dio BINAURAL</text>
  <text x="37" y="216">WEB AUDIO DSP</text>
  <text x="37" y="336">CUSHIONED RAIN</text>
  <text x="516" y="116">ZERO HARSHNESS</text>
  <text x="516" y="316">PROMPT LAB</text>
</g>

<!-- 中央声学工作台外壳 -->
<rect x="130" y="42" width="380" height="364" rx="18" fill="#1b2a2e" stroke="#48686a" stroke-width="2"/>
<rect x="140" y="52" width="360" height="344" rx="14" fill="url(#bg-grad)"/>

<!-- 顶栏状态 -->
<rect x="140" y="52" width="360" height="38" rx="14" fill="#132024"/>
<circle cx="162" cy="71" r="5" fill="#2dd4bf"/>
<text x="176" y="75" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#cbd7dd">AI-ASMR SOUNDSTAGE</text>
<rect x="420" y="62" width="66" height="18" rx="9" fill="#0f766e" fill-opacity="0.4"/>
<text x="432" y="75" font-family="monospace" font-size="10" fill="#2dd4bf">3Dio HEAD</text>

<!-- 3Dio 假人头麦克风双耳示意轮廓 -->
<g transform="translate(320, 210)">
  <!-- 头部中轴主体 -->
  <path d="M-40 -60 C-40 -85, 40 -85, 40 -60 C40 -20, 32 40, 0 60 C-32 40, -40 -20, -40 -60 Z" fill="#192a30" stroke="#334d54" stroke-width="1.5"/>

  <!-- 左耳模型与声波辐射 -->
  <path d="M-40 -20 C-62 -22, -66 10, -40 18 C-44 5, -50 -10, -40 -20 Z" fill="#243d42" stroke="#2dd4bf" stroke-width="1.8"/>
  <circle cx="-52" cy="-2" r="3" fill="#2dd4bf"/>
  <path d="M-65 -30 A 40 40 0 0 0 -65 30" fill="none" stroke="url(#ear-l)" stroke-width="2" stroke-dasharray="3 3"/>
  <path d="M-80 -45 A 60 60 0 0 0 -80 45" fill="none" stroke="url(#ear-l)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M-98 -60 A 85 85 0 0 0 -98 60" fill="none" stroke="url(#ear-l)" stroke-width="1" stroke-opacity="0.5"/>
  <text x="-95" y="8" font-family="monospace" font-size="11" font-weight="bold" fill="#2dd4bf">L</text>

  <!-- 右耳模型与声波辐射 -->
  <path d="M40 -20 C62 -22, 66 10, 40 18 C44 5, 50 -10, 40 -20 Z" fill="#243d42" stroke="#38bdf8" stroke-width="1.8"/>
  <circle cx="52" cy="-2" r="3" fill="#38bdf8"/>
  <path d="M65 -30 A 40 40 0 0 1 65 30" fill="none" stroke="url(#ear-r)" stroke-width="2" stroke-dasharray="3 3"/>
  <path d="M80 -45 A 60 60 0 0 1 80 45" fill="none" stroke="url(#ear-r)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M98 -60 A 85 85 0 0 1 98 60" fill="none" stroke="url(#ear-r)" stroke-width="1" stroke-opacity="0.5"/>
  <text x="88" y="8" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8">R</text>

  <!-- 柔和雨滴与钝感涟漪 -->
  <!-- 雨丝 -->
  <line x1="-70" y1="-100" x2="-62" y2="-75" stroke="#7dd3fc" stroke-width="1.4" stroke-opacity="0.6"/>
  <line x1="-30" y1="-120" x2="-24" y2="-92" stroke="#7dd3fc" stroke-width="1.2" stroke-opacity="0.5"/>
  <line x1="20" y1="-115" x2="26" y2="-88" stroke="#7dd3fc" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="68" y1="-105" x2="74" y2="-80" stroke="#7dd3fc" stroke-width="1.3" stroke-opacity="0.6"/>
  <line x1="0" y1="-130" x2="4" y2="-105" stroke="#7dd3fc" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- 软垫钝感碰撞点与涟漪 -->
  <ellipse cx="-48" cy="88" rx="28" ry="7" fill="none" stroke="#2dd4bf" stroke-width="1.2" stroke-opacity="0.7"/>
  <ellipse cx="-48" cy="88" rx="46" ry="12" fill="none" stroke="#2dd4bf" stroke-width="0.8" stroke-opacity="0.4"/>
  <ellipse cx="44" cy="98" rx="32" ry="8" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7"/>
  <ellipse cx="44" cy="98" rx="55" ry="14" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.3"/>
</g>

<!-- 底部控制与声学频段提示条 -->
<rect x="156" y="336" width="328" height="42" rx="8" fill="#132024" stroke="#2a3f45" stroke-width="1"/>
<g font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">
  <text x="172" y="361">模式：</text>
  <text x="210" y="361" fill="#2dd4bf" font-weight="bold">微雨 / 帐篷布</text>
  <text x="320" y="361">频段：</text>
  <text x="358" y="361" fill="#f1a65a">LPF ≤ 2.4kHz</text>
  <text x="442" y="361" fill="#38bdf8">3Dio 双耳</text>
</g>
</svg>