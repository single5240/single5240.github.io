title: single5240 笔记分享
description: 记录嵌入式开发、Linux 与 Qt 实践中的思考、方法和踩坑经验。
url: https://single5240.github.io
lang: zh-CN
timezone: Asia/Shanghai
defaults:
  - scope:
      path: english
    values:
      section: daily
  - scope:
      path: ""
      type: english
    values:
      section: daily
  - scope:
      path: ai-news
    values:
      section: daily
  - scope:
      path: ""
      type: skills
    values:
      layout: skill
      section: projects
collections:
  articles:
    output: true
    permalink: /articles/:name.html
  english:
    output: true
    permalink: /english/:name.html
  skills:
    output: true
    permalink: /projects/my-skills/:name.html
plugins:
  - jekyll-feed
feed:
  path: /feed/posts.xml
  collections:
    articles:
      path: /feed.xml
repository: single5240/single5240.github.io
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - AGENTS.md
  - vercel.json
  - .vercel
  - scripts
  - vendor
  - docs

# 评论系统 (Waline: 轻量级、免注册访客评论、邮件提醒与反垃圾)
waline:
  server_url: "http://47.107.131.210:8360"
  emoji:
    - https://unpkg.com/@waline/emojis@1.2.0/weibo
    - https://unpkg.com/@waline/emojis@1.2.0/bilibili

# 隐私统计系统 (Umami: 极轻量、无 Cookie、GDPR 合规、防 AdBlock 误杀)
umami:
  website_id: "17647b5b-ae66-4697-b0bc-168c6c7f2d11"
  script_url: "http://47.107.131.210:3000/script.js"
  host_url: ""
  domains: "single5240.github.io"
