<div class="theme-spectrum-wrap" aria-label="专题色卡工作台">
  <div class="robot-stage" id="robotStage">
    <!-- 背景：示波器波形（正弦 / 方波 / 马鞍波 / 心电 / RLC / AM / FM / Chirp / UART / I2C / CAN 等 18 种随机平滑切换） -->
    <canvas class="scope-canvas" id="scopeCanvas" aria-hidden="true"></canvas>

    <button type="button" class="stage-meta scope-channel" id="scopeChannel" aria-label="示波器通道 1，点击切换波形">
      <span class="stage-meta-dot" aria-hidden="true"></span>
      <span aria-hidden="true">CH1 ▸</span>
      <strong id="scopeChannelName">正弦波</strong>
    </button>
    <span class="stage-meta stage-meta-right" id="scopeReadout" aria-hidden="true">50Hz · 1V/div</span>

    <!-- 复古实验小机器人 -->
    <div class="robot-dock" id="robotDock">
      <span class="robot-speech" id="robotSpeech" aria-live="polite">
        <span class="speech-prefix" aria-hidden="true">&gt;</span>
        <span id="robotSpeechText"></span>
      </span>

      <button type="button" class="retro-robot-container" id="retroRobot" aria-label="工作台小机器人，点击和它打个招呼">
        {% include retro-robot-svg.html %}
      </button>

      <button type="button" class="dock-to-top" id="dockToTop" title="回到顶部" aria-label="回到顶部">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg>
      </button>
    </div>
  </div>

  <div class="theme-spectrum" id="themeSpectrum">
    {% for topic in site.data.topics %}
    <a href="{{ '/topics/' | append: topic.id | append: '.html' | relative_url }}"
       class="spectrum-item{% if page.topic == topic.id %} is-active{% endif %}"
       style="--item-color-1: {{ topic.color | default: 'var(--accent)' }}; --item-color-2: {{ topic.color_end | default: 'var(--accent-dark)' }};"
       data-label="{{ topic.title }} · {{ topic.articles.size }}篇"
       aria-label="{{ topic.title }}专题，共 {{ topic.articles.size }} 篇笔记">
      <span class="spectrum-bar"></span>
      <span class="spectrum-tooltip">{{ topic.title }} <small>{{ topic.articles.size }}篇</small></span>
    </a>
    {% endfor %}
  </div>
</div>
