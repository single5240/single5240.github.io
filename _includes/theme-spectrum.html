<div class="theme-spectrum-wrap" aria-label="专题色彩光谱与复古机器人吉祥物">
  <div class="rainbow-mascot-stage" id="rainbowMascotStage">
    <!-- 交互式弹性彩虹物理画布 -->
    <canvas class="rainbow-canvas" id="rainbowCanvas" aria-hidden="true"></canvas>

    <!-- 复古极客小机器人吉祥物 -->
    <div class="retro-robot-container" id="retroRobot" tabindex="0" role="button" aria-label="复古小机器人吉祥物，点击可与其互动" title="点击与小机器人互动">
      <div class="robot-speech" id="robotSpeech" aria-hidden="true">
        <span class="speech-prefix">&gt;</span> <span class="speech-text" id="robotSpeechText">SYSTEM ONLINE ⚡</span>
      </div>

      <svg class="retro-robot-svg" viewBox="0 0 160 160" width="128" height="128" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="robotMetalGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#334155" />
            <stop offset="100%" stop-color="#1e293b" />
          </linearGradient>
          <linearGradient id="robotScreenGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#022c22" />
            <stop offset="100%" stop-color="#064e3b" />
          </linearGradient>
          <linearGradient id="pcbGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#064e3b" />
            <stop offset="50%" stop-color="#047857" />
            <stop offset="100%" stop-color="#064e3b" />
          </linearGradient>
        </defs>

        <!-- 底座：PCB 沉金焊盘与电路走线 -->
        <g class="robot-part-pedestal">
          <rect x="24" y="142" width="112" height="12" rx="4" fill="url(#pcbGrad)" stroke="#10b981" stroke-width="1.2" />
          <line x1="34" y1="148" x2="48" y2="148" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
          <line x1="54" y1="148" x2="68" y2="148" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
          <line x1="92" y1="148" x2="106" y2="148" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
          <line x1="112" y1="148" x2="126" y2="148" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
          <circle cx="80" cy="148" r="2.5" fill="#fbbf24" />
        </g>

        <!-- 手臂：金属波纹软管与爪手 -->
        <g class="robot-part-arms">
          <path d="M 46 102 C 32 106 28 118 36 128" stroke="#64748b" stroke-width="6" stroke-linecap="round" fill="none" />
          <circle cx="36" cy="128" r="3.5" fill="#94a3b8" />
          <!-- 抬手挥舞的右臂 -->
          <path d="M 114 102 C 128 100 134 90 128 78" stroke="#64748b" stroke-width="6" stroke-linecap="round" fill="none" class="robot-wave-arm" />
          <circle cx="128" cy="76" r="3.5" fill="#94a3b8" />
          <path d="M 124 72 C 127 67 133 67 135 72" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none" />
        </g>

        <!-- 躯干：复古工控/示波器主机箱 -->
        <g class="robot-part-body">
          <rect x="46" y="92" width="68" height="48" rx="8" fill="url(#robotMetalGrad)" stroke="#475569" stroke-width="1.8" />
          <circle cx="51" cy="97" r="1.5" fill="#94a3b8" />
          <circle cx="109" cy="97" r="1.5" fill="#94a3b8" />
          <circle cx="51" cy="135" r="1.5" fill="#94a3b8" />
          <circle cx="109" cy="135" r="1.5" fill="#94a3b8" />
          <!-- 迷你示波器视窗与动态波形 -->
          <rect x="53" y="101" width="28" height="18" rx="3" fill="#022c22" stroke="#059669" stroke-width="1" />
          <path d="M 55 110 Q 60 104 67 110 T 79 110" stroke="#34d399" stroke-width="1.5" fill="none" class="robot-scope-wave" />
          <!-- 仪器仪表指示灯与旋钮 -->
          <circle cx="89" cy="106" r="3" fill="#ef4444" />
          <circle cx="99" cy="106" r="3" fill="#10b981" />
          <circle cx="94" cy="118" r="5" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />
          <line x1="94" y1="118" x2="94" y2="114" stroke="#fbbf24" stroke-width="1.5" />
          <line x1="55" y1="126" x2="79" y2="126" stroke="#1e293b" stroke-width="2" />
          <line x1="55" y1="130" x2="79" y2="130" stroke="#1e293b" stroke-width="2" />
        </g>

        <!-- 颈部连接轴 -->
        <rect x="73" y="86" width="14" height="6" rx="2" fill="#475569" />

        <!-- 头部：CRT 荧光绿视窗与电子眼 -->
        <g class="robot-part-head">
          <rect x="37" y="52" width="7" height="14" rx="2" fill="#64748b" stroke="#334155" stroke-width="1" />
          <rect x="116" y="52" width="7" height="14" rx="2" fill="#64748b" stroke="#334155" stroke-width="1" />
          <rect x="44" y="38" width="72" height="48" rx="10" fill="url(#robotMetalGrad)" stroke="#475569" stroke-width="2" />
          <circle cx="49" cy="43" r="1.5" fill="#94a3b8" />
          <circle cx="111" cy="43" r="1.5" fill="#94a3b8" />
          <circle cx="49" cy="81" r="1.5" fill="#94a3b8" />
          <circle cx="111" cy="81" r="1.5" fill="#94a3b8" />
          <rect x="52" y="44" width="56" height="34" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
          <rect x="54" y="46" width="52" height="30" rx="5" fill="url(#robotScreenGrad)" />

          <!-- 点阵电子眼（定时眨眼动画） -->
          <g class="robot-eyes">
            <rect x="62" y="54" width="10" height="12" rx="4" fill="#38bdf8" class="robot-eye robot-eye-left" />
            <rect x="88" y="54" width="10" height="12" rx="4" fill="#38bdf8" class="robot-eye robot-eye-right" />
            <circle cx="65" cy="57" r="1.5" fill="#ffffff" />
            <circle cx="91" cy="57" r="1.5" fill="#ffffff" />
          </g>

          <!-- 示波器声波微笑 -->
          <path d="M 72 69 Q 80 74 88 69" stroke="#34d399" stroke-width="2" stroke-linecap="round" fill="none" />
        </g>

        <!-- 弹簧天线与心跳二极管 -->
        <g class="robot-part-antenna">
          <path d="M 80 38 L 80 32 L 76 28 L 84 24 L 76 20 L 80 16" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          <circle cx="80" cy="12" r="8" fill="#f43f5e" opacity="0.3" class="antenna-glow-ring" />
          <circle cx="80" cy="12" r="5" fill="#f43f5e" stroke="#ffe4e6" stroke-width="1.5" />
        </g>
      </svg>
    </div>
  </div>

  <div class="theme-spectrum" id="themeSpectrum">
    {% for topic in site.data.topics %}
    <a href="{{ '/topics/' | append: topic.id | append: '.html' | relative_url }}"
       class="spectrum-item"
       style="--item-color-1: {{ topic.color | default: 'var(--accent)' }}; --item-color-2: {{ topic.color_end | default: 'var(--accent-dark)' }};"
       data-label="{{ topic.title }} · {{ topic.articles.size }}篇"
       aria-label="{{ topic.title }}专题，共 {{ topic.articles.size }} 篇笔记">
      <span class="spectrum-bar"></span>
      <span class="spectrum-tooltip">{{ topic.title }} <small>{{ topic.articles.size }}篇</small></span>
    </a>
    {% endfor %}
  </div>
</div>
